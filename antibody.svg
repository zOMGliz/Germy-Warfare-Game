  <!-- Arms -->
  <rect x="10" y="18" width="6" height="18" rx="2" fill="#ffdd55" stroke="#ccaa22" stroke-width="1" transform="rotate(-35 13 27)"/>
  <rect x="24" y="18" width="6" height="18" rx="2" fill="#ffdd55" stroke="#ccaa22" stroke-width="1" transform="rotate(35 27 27)"/>
