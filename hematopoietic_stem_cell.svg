<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Shadow -->
  <ellipse cx="100" cy="170" rx="38" ry="10" fill="#000000" opacity="0.2"/>

  <!-- Cell membrane (irregular, stem-cell-like) -->
  <ellipse cx="100" cy="95" rx="52" ry="48" fill="#e8d5ff" stroke="#6b4e9e" stroke-width="4"/>

  <!-- Cytoplasm highlight -->
  <ellipse cx="82" cy="72" rx="22" ry="18" fill="#f5e8ff" opacity="0.6"/>

  <!-- Large nucleus (stem cell hallmark!) -->
  <ellipse cx="102" cy="95" rx="32" ry="28" fill="#4a2c7a" stroke="#2d1a4a" stroke-width="3"/>

  <!-- Nucleus highlights -->
  <ellipse cx="90" cy="84" rx="10" ry="7" fill="#6b4e9e" opacity="0.5"/>
  <ellipse cx="112" cy="102" rx="6" ry="5" fill="#2d1a4a" opacity="0.4"/>

  <!-- Nucleolus -->
  <circle cx="105" cy="97" r="7" fill="#3a2361"/>

  <!-- Chromatin speckles -->
  <circle cx="95" cy="90" r="2.5" fill="#2d1a4a"/>
  <circle cx="112" cy="89" r="2" fill="#2d1a4a"/>
  <circle cx="98" cy="105" r="1.8" fill="#2d1a4a"/>
  <circle cx="115" cy="100" r="2.2" fill="#2d1a4a"/>

  <!-- Cytoplasmic organelles (mitochondria, ER hints) -->
  <ellipse cx="72" cy="88" rx="6" ry="3" fill="#b8a0d8" opacity="0.7"/>
  <ellipse cx="128" cy="105" rx="5" ry="3" fill="#b8a0d8" opacity="0.7"/>
  <ellipse cx="82" cy="112" rx="4" ry="2.5" fill="#b8a0d8" opacity="0.6"/>

  <!-- Surface markers (CD34, etc. — little receptors) -->
  <circle cx="65" cy="78" r="4" fill="#ff9f43" stroke="#e17055" stroke-width="1.5"/>
  <circle cx="135" cy="70" r="3.5" fill="#ff9f43" stroke="#e17055" stroke-width="1.5"/>
  <circle cx="62" cy="108" r="3" fill="#ff9f43" stroke="#e17055" stroke-width="1.5"/>
  <circle cx="138" cy="115" r="4" fill="#ff9f43" stroke="#e17055" stroke-width="1.5"/>

  <!-- Tiny cytoplasmic extensions (stem cell "reach") -->
  <g stroke="#6b4e9e" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="58" y1="85" x2="50" y2="78"/>
    <line x1="142" y1="88" x2="151" y2="80"/>
    <line x1="68" y1="118" x2="60" y2="128"/>
    <line x1="132" y1="120" x2="140" y2="130"/>
  </g>

  <!-- Subtle pluripotency dots (potential!) -->
  <circle cx="78" cy="62" r="2" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="125" cy="66" r="1.8" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="70" cy="128" r="1.5" fill="#ff6b6b" opacity="0.8"/>

</svg>