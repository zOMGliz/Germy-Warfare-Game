<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Shadow -->
  <ellipse cx="50" cy="82" rx="24" ry="7" fill="#000000" opacity="0.25"/>

  <!-- Main body (dusty lavender-purple, blobby, +0.1" diameter) -->
  <g fill="#8b6fa7" stroke="#5a4a70" stroke-width="3">
    <!-- Pushed-out blobby lumps (no dominant center) -->
    <circle cx="48" cy="40" r="19"/>
    <circle cx="62" cy="44" r="18"/>
    <circle cx="39" cy="52" r="17"/>
    <circle cx="56" cy="58" r="18"/>
    <circle cx="45" cy="65" r="16"/>
    <circle cx="64" cy="62" r="15"/>
  </g>

  <!-- Soft highlight across top-left blob -->
  <circle cx="43" cy="38" r="8" fill="#d0b8e0" opacity="0.5"/>

  <!-- Internal histamine granules (dark purple blobs) -->
  <circle cx="44" cy="42" r="8" fill="#5a3c7a" stroke="#3a2650" stroke-width="1.5"/>
  <circle cx="58" cy="48" r="7" fill="#4a2f68" stroke="#3a2650" stroke-width="1.5"/>
  <circle cx="50" cy="60" r="7.5" fill="#6a4a8a" stroke="#3a2650" stroke-width="1.5"/>

  <!-- Granule highlights -->
  <circle cx="42" cy="40" r="2.5" fill="#a48fc4" opacity="0.6"/>
  <circle cx="56" cy="46" r="2" fill="#a48fc4" opacity="0.6"/>
  <circle cx="48" cy="58" r="2.5" fill="#a48fc4" opacity="0.6"/>

  <!-- Sleepy eyes (very droopy, half-closed) -->
  <!-- Left eye (narrow ellipse, sleepy) -->
  <ellipse cx="41" cy="44" rx="6" ry="3.5" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- Right eye (narrow ellipse, sleepy) -->
  <ellipse cx="59" cy="44" rx="6" ry="3.5" fill="#fff" stroke="#333" stroke-width="2"/>

  <!-- Pupils (low, sleepy) -->
  <circle cx="41" cy="45" r="3" fill="#222"/>
  <circle cx="59" cy="45" r="3" fill="#222"/>

  <!-- Tiny eye shine (minimal, sleepy) -->
  <circle cx="40" cy="43" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="58" cy="43" r="1" fill="#fff" opacity="0.5"/>

  <!-- Slight open mouth (white, sleepy yawn) -->
  <ellipse cx="50" cy="55" rx="5" ry="2" fill="#fff" stroke="#333" stroke-width="1"/>
</svg>
