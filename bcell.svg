<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Shadow -->
  <ellipse cx="50" cy="82" rx="22" ry="6" fill="#000000" opacity="0.25"/>

  <!-- Main body (blue-purple B cell) -->
  <circle cx="50" cy="46" r="24" fill="#4488cc" stroke="#225588" stroke-width="3"/>

  <!-- Body highlight -->
  <circle cx="42" cy="38" r="9" fill="#88aaff" opacity="0.5"/>

  <!-- Bumpy receptors on surface -->
  <g fill="#3366aa" opacity="0.8">
    <circle cx="36" cy="34" r="3"/>
    <circle cx="62" cy="36" r="2.5"/>
    <circle cx="32" cy="52" r="3"/>
    <circle cx="64" cy="55" r="2.5"/>
    <circle cx="44" cy="63" r="2"/>
  </g>

  <!-- Nucleus (large, dark) -->
  <circle cx="50" cy="46" r="11" fill="#112244" stroke="#001133" stroke-width="2"/>
  <!-- Nucleolus -->
  <circle cx="47" cy="43" r="4" fill="#334466"/>

  <!-- Antibody Y icons floating around (hint at power) -->
  <g fill="none" stroke="#ffee88" stroke-width="1.5" opacity="0.7">
    <!-- Top left -->
    <path d="M28 28 L32 22 L36 28"/>
    <line x1="32" y1="22" x2="32" y2="19"/>
    <!-- Top right -->
    <path d="M64 26 L68 20 L72 26"/>
    <line x1="68" y1="20" x2="68" y2="17"/>
    <!-- Bottom -->
    <path d="M39 61 L43 55 L47 61"/>
    <line x1="43" y1="55" x2="43" y2="52"/>
  </g>

  <!-- Soft glow ring (subtle immune aura) -->
  <circle cx="50" cy="46" r="29" fill="none" stroke="#aaddff" stroke-width="1" opacity="0.3"/>
</svg>
