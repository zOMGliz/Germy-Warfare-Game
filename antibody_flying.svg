<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 70" width="50" height="70">
  <!-- Flying antibody: dynamic, in motion -->
  <g transform="rotate(8 25 35)">
    <!-- Stem -->
    <rect x="20" y="30" width="8" height="30" rx="2" fill="#ffdd55" stroke="#ccaa22" stroke-width="1"/>
    <!-- Arms -->
    <rect x="12" y="20" width="8" height="22" rx="2" fill="#ffdd55" stroke="#ccaa22" stroke-width="1" transform="rotate(-40 16 31)"/>
    <rect x="28" y="20" width="8" height="22" rx="2" fill="#ffdd55" stroke="#ccaa22" stroke-width="1" transform="rotate(40 32 31)"/>
    <!-- Binding tips -->
    <circle cx="7" cy="14" r="5" fill="#ffee88" stroke="#ccaa22" stroke-width="1"/>
    <circle cx="41" cy="14" r="5" fill="#ffee88" stroke="#ccaa22" stroke-width="1"/>
  </g>
  <!-- Motion lines -->
  <g stroke="#ffee88" stroke-width="1.5" opacity="0.5">
    <line x1="8" y1="35" x2="3" y2="33"/>
    <line x1="7" y1="42" x2="2" y2="41"/>
    <line x1="41" y1="38" x2="46" y2="35"/>
  </g>
  <!-- Speed dots -->
  <circle cx="4" cy="38" r="1.5" fill="#ffdd55" opacity="0.6"/>
  <circle cx="47" cy="40" r="1" fill="#ffdd55" opacity="0.6"/>
</svg>
