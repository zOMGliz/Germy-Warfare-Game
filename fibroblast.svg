<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Shadow -->
  <ellipse cx="50" cy="82" rx="24" ry="7" fill="#000000" opacity="0.2"/>

  <!-- Cell body (green fibroblast) -->
  <circle cx="50" cy="48" r="28" fill="#44aa55" stroke="#2e7a3a" stroke-width="3"/>

  <!-- Subtle highlight on body -->
  <circle cx="40" cy="38" r="10" fill="#77cc88" opacity="0.5"/>

  <!-- Nucleus -->
  <circle cx="50" cy="48" r="10" fill="#225522" stroke="#1a4420" stroke-width="2"/>

  <!-- Nucleolus (tiny bright spot inside nucleus) -->
  <circle cx="47" cy="45" r="3" fill="#3a773a"/>
</svg>
