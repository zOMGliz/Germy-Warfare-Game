<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Shadow -->
  <ellipse cx="50" cy="82" rx="22" ry="6" fill="#000000" opacity="0.25"/>

  <!-- Main body (bright blue-purple, activated B cell) -->
  <circle cx="50" cy="46" r="24" fill="#5599dd" stroke="#3366aa" stroke-width="3"/>

  <!-- Strong highlight -->
  <circle cx="42" cy="38" r="10" fill="#aaddff" opacity="0.7"/>

  <!-- Extra receptors (more activated) -->
  <g fill="#4488dd" opacity="0.9">
    <circle cx="34" cy="32" r="3.5"/>
    <circle cx="64" cy="34" r="3"/>
    <circle cx="30" cy="50" r="3.5"/>
    <circle cx="66" cy="52" r="3"/>
    <circle cx="42" cy="62" r="3"/>
    <circle cx="58" cy="64" r="2.5"/>
  </g>

  <!-- Large nucleus -->
  <circle cx="50" cy="46" r="11" fill="#112244" stroke="#001133" stroke-width="2"/>
  <circle cx="47" cy="43" r="4" fill="#4466aa"/>

  <!-- MANY antibody Y icons floating (very active) -->
  <g fill="none" stroke="#ffee66" stroke-width="2" opacity="0.9">
    <!-- Top -->
    <path d="M26 26 L31 19 L36 26"/>
    <line x1="31" y1="19" x2="31" y2="16"/>
    <path d="M64 24 L69 17 L74 24"/>
    <line x1="69" y1="17" x2="69" y2="14"/>
    <!-- Sides -->
    <path d="M27 44 L32 37 L37 44"/>
    <line x1="32" y1="37" x2="32" y2="34"/>
    <path d="M63 47 L68 40 L73 47"/>
    <line x1="68" y1="40" x2="68" y2="37"/>
    <!-- Bottom -->
    <path d="M35 60 L40 53 L45 60"/>
    <line x1="40" y1="53" x2="40" y2="50"/>
    <path d="M55 61 L60 54 L65 61"/>
    <line x1="60" y1="54" x2="60" y2="51"/>
  </g>

  <!-- Bright aura ring -->
  <circle cx="50" cy="46" r="30" fill="none" stroke="#ccffff" stroke-width="2" opacity="0.5"/>
