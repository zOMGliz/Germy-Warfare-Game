<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Shadow -->
  <ellipse cx="50" cy="82" rx="22" ry="6" fill="#000000" opacity="0.25"/>

  <!-- Main body (smug blue helper T cell) -->
  <circle cx="50" cy="46" r="26" fill="#4488dd" stroke="#225588" stroke-width="3"/>

  <!-- Body highlight -->
  <circle cx="42" cy="38" r="10" fill="#88aaff" opacity="0.5"/>

  <!-- Gold trim ring (goody two shoes bling) -->
  <circle cx="50" cy="46" r="21" fill="none" stroke="#ffdd44" stroke-width="2" opacity="0.8"/>

  <!-- Tiny gold star badge (teachers pet) -->
  <g fill="#ffdd44" stroke="#ccaa22" stroke-width="1">
    <polygon points="50,29 52,34 57,34 53,37 54,42 50,39 46,42 47,37 43,34 48,34"/>
  </g>

  <!-- Little bow tie collar -->
  <g fill="#225577" stroke="#113355" stroke-width="1">
    <!-- Left bow -->
    <path d="M38 56 Q42 51 45 56" fill="none" stroke-width="2"/>
    <ellipse cx="41" cy="55" rx="3" ry="2"/>
    <!-- Right bow -->
    <path d="M55 56 Q58 51 62 56" fill="none" stroke-width="2"/>
    <ellipse cx="59" cy="55" rx="3" ry="2"/>
    <!-- Center knot -->
    <circle cx="50" cy="55" r="2.5"/>
  </g>

  <!-- Nucleus (smug brain) -->
  <circle cx="50" cy="46" r="11" fill="#112244" stroke="#001133" stroke-width="2"/>
  <circle cx="47" cy="43" r="4" fill="#334466"/>

  <!-- Kawaii eyes - snotty / superior look -->
  <!-- Left eye (slightly narrowed, raised inner corner) -->
  <ellipse cx="41" cy="41" rx="7" ry="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- Right eye -->
  <ellipse cx="59" cy="41" rx="7" ry="6" fill="#fff" stroke="#333" stroke-width="2"/>

  <!-- Pupils (looking slightly down-left, smug) -->
  <circle cx="40" cy="42" r="4" fill="#333"/>
  <circle cx="58" cy="42" r="4" fill="#333"/>

  <!-- Eye sparkles (small, self-satisfied) -->
  <circle cx="39" cy="39" r="1.5" fill="#fff"/>
  <circle cx="57" cy="39" r="1.5" fill="#fff"/>

  <!-- Snotty raised eyebrows (arched, superior) -->
  <path d="M33 33 Q38 29 45 33" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <path d="M55 33 Q62 29 67 33" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>

  <!-- Smug smirk (white mouth) -->
  <path d="M44 52 Q50 56 56 52" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Tiny uptick on one side (extra smug) -->
  <path d="M54 51 Q56 50 57 51" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Little blush (subtle, smug confidence) -->
  <circle cx="32" cy="48" r="4" fill="#ff6699" opacity="0.25"/>
  <circle cx="68" cy="48" r="4" fill="#ff6699" opacity="0.25"/>
</svg>
