<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Shadow -->
  <ellipse cx="100" cy="170" rx="45" ry="12" fill="#000000" opacity="0.2"/>

  <!-- Main body (purple capsid) - bright happy purple -->
  <circle cx="100" cy="95" r="48" fill="#af7ac5" stroke="#6c3483" stroke-width="4"/>

  <!-- Highlight on body -->
  <circle cx="82" cy="72" r="18" fill="#d7bde2" opacity="0.7"/>

  <!-- Rotating glycoprotein ring (slow random-ish orbit) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      from="0 100 95" to="360 100 95" dur="26s" repeatCount="indefinite"/>
    <!-- Red glycoproteins -->
    <g fill="#e74c3c" stroke="#c0392b" stroke-width="2">
      <circle cx="100" cy="36" r="10"/>
      <circle cx="80" cy="42" r="9"/>
      <circle cx="120" cy="42" r="9"/>
      <circle cx="60" cy="58" r="9"/>
      <circle cx="140" cy="58" r="9"/>
      <circle cx="48" cy="95" r="10"/>
      <circle cx="152" cy="95" r="10"/>
      <circle cx="60" cy="132" r="9"/>
      <circle cx="140" cy="132" r="9"/>
      <circle cx="80" cy="148" r="9"/>
      <circle cx="120" cy="148" r="9"/>
    </g>
    <!-- Tiny stems -->
    <g stroke="#c0392b" stroke-width="3" stroke-linecap="round">
      <line x1="100" y1="55" x2="100" y2="48"/>
      <line x1="82" y1="62" x2="77" y2="55"/>
      <line x1="118" y1="62" x2="123" y2="55"/>
      <line x1="67" y1="75" x2="60" y2="67"/>
      <line x1="133" y1="75" x2="140" y2="67"/>
      <line x1="57" y1="95" x2="60" y2="95"/>
      <line x1="143" y1="95" x2="140" y2="95"/>
      <line x1="67" y1="115" x2="60" y2="123"/>
      <line x1="133" y1="115" x2="140" y2="123"/>
      <line x1="82" y1="128" x2="77" y2="135"/>
      <line x1="118" y1="128" x2="123" y2="135"/>
    </g>
  </g>

  <!-- Exalted face -->
  <!-- Big joyful eyes (white) -->
  <circle cx="82" cy="84" r="7" fill="#fff"/>
  <circle cx="118" cy="84" r="7" fill="#fff"/>
  <!-- Sparkle pupils -->
  <circle cx="84" cy="82" r="3" fill="#2c3e50"/>
  <circle cx="120" cy="82" r="3" fill="#2c3e50"/>
  <!-- Eye shine -->
  <circle cx="85" cy="80" r="1.5" fill="#fff"/>
  <circle cx="121" cy="80" r="1.5" fill="#fff"/>
  <!-- Happy eyebrows (curved up) -->
  <path d="M72 72 Q82 68 92 73" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M108 73 Q118 68 128 72" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Big triumphant smile -->
  <path d="M78 105 Q100 130 122 105" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- Sparkles around head -->
  <g fill="#fff" opacity="0.9">
    <polygon points="60,55 62,60 67,60 63,63 65,68 60,65 55,68 57,63 53,60 58,60"/>
    <circle cx="140" cy="52" r="3"/>
    <circle cx="55" cy="115" r="2"/>
    <circle cx="145" cy="118" r="2"/>
  </g>
</svg>
