<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Shadow -->
  <ellipse cx="50" cy="82" rx="24" ry="7" fill="#000000" opacity="0.2"/>

  <!-- Sickly yellow-green cell body -->
  <circle cx="50" cy="48" r="28" fill="#aacc44" stroke="#668822" stroke-width="3"/>

  <!-- Subtle highlight on body -->
  <circle cx="40" cy="38" r="10" fill="#ccee66" opacity="0.5"/>

  <!-- Pulsing red infection core -->
  <g>
    <circle cx="50" cy="48" r="14" fill="#cc3333" opacity="0.6">
      <animate attributeName="r" values="12;16;12" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Nucleus (dark, infected) -->
  <circle cx="50" cy="48" r="8" fill="#331100" stroke="#550000" stroke-width="2"/>

  <!-- Red virus dots (pulsing) -->
  <g fill="#ff4444">
    <circle cx="38" cy="40" r="3">
      <animate attributeName="r" values="2;4;2" dur="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="61" cy="43" r="2.5">
      <animate attributeName="r" values="1.5;3.5;1.5" dur="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45" cy="57" r="2">
      <animate attributeName="r" values="1.5;3;1.5" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="56" cy="55" r="3">
      <animate attributeName="r" values="2;4;2" dur="0.65s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Red veins / infection lines -->
  <g stroke="#cc2222" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <line x1="50" y1="40" x2="50" y2="34"/>
    <line x1="50" y1="56" x2="50" y2="62"/>
    <line x1="42" y1="48" x2="36" y2="48"/>
    <line x1="58" y1="48" x2="64" y2="48"/>
  </g>

  <!-- Outer red infection glow ring -->
  <circle cx="50" cy="48" r="31" fill="none" stroke="#ff3333" stroke-width="2" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
