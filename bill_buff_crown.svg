<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" width="220" height="240">
  <!-- Shadow -->
  <ellipse cx="110" cy="205" rx="48" ry="12" fill="#000000" opacity="0.2"/>

  <!-- OVAL BODY (tall up/down, skinny side-to-side) -->
  <ellipse cx="110" cy="110" rx="38" ry="60" fill="#9b59b6" stroke="#6c3483" stroke-width="5"/>

  <!-- Body highlight -->
  <ellipse cx="92" cy="80" rx="16" ry="24" fill="#c39bd3" opacity="0.6"/>

  <!-- Rotating glycoprotein ring -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      from="0 110 110" to="360 110 110" dur="20s" repeatCount="indefinite"/>
    <g fill="#e74c3c" stroke="#c0392b" stroke-width="2.5">
      <!-- Spikes around the oval -->
      <circle cx="110" cy="45" r="10"/>
      <circle cx="78" cy="58" r="9"/>
      <circle cx="142" cy="58" r="9"/>
      <circle cx="62" cy="80" r="9"/>
      <circle cx="158" cy="80" r="9"/>
      <circle cx="58" cy="110" r="10"/>
      <circle cx="162" cy="110" r="10"/>
      <circle cx="62" cy="140" r="9"/>
      <circle cx="158" cy="140" r="9"/>
      <circle cx="78" cy="162" r="9"/>
      <circle cx="142" cy="162" r="9"/>
      <circle cx="110" cy="175" r="10"/>
    </g>
    <g stroke="#c0392b" stroke-width="3.5" stroke-linecap="round">
      <line x1="110" y1="65" x2="110" y2="55"/>
      <line x1="82" y1="72" x2="73" y2="64"/>
      <line x1="138" y1="72" x2="147" y2="64"/>
      <line x1="70" y1="88" x2="62" y2="82"/>
      <line x1="150" y1="88" x2="158" y2="82"/>
      <line x1="66" y1="110" x2="68" y2="110"/>
      <line x1="154" y1="110" x2="152" y2="110"/>
    </g>
  </g>

  <!-- THE CROWN (gold, kingly!) -->
  <g>
    <rect x="72" y="32" width="76" height="11" rx="2" fill="#f1c40f" stroke="#b7950b" stroke-width="3"/>
    <g fill="#f1c40f" stroke="#b7950b" stroke-width="2">
      <polygon points="77,32 72,15 83,32"/>
      <polygon points="93,32 88,10 102,32"/>
      <polygon points="110,32 105,6 115,32"/>
      <polygon points="127,32 118,10 132,32"/>
      <polygon points="143,32 137,15 148,32"/>
    </g>
    <circle cx="88" cy="26" r="4" fill="#e74c3c" stroke="#fff" stroke-width="1"/>
    <circle cx="110" cy="23" r="5" fill="#e74c3c" stroke="#fff" stroke-width="1.5"/>
    <circle cx="132" cy="26" r="4" fill="#e74c3c" stroke="#fff" stroke-width="1"/>
    <circle cx="110" cy="21" r="1.5" fill="#fff"/>
  </g>

  <!-- OVAL FACE -->
  <ellipse cx="110" cy="105" rx="26" ry="34" fill="#8e4da6" stroke="#6c3483" stroke-width="3"/>

  <!-- Broad cheekbones (rectangles, wide) -->
  <rect x="74" y="88" width="18" height="26" fill="#c39bd3" opacity="0.7" rx="3"/>
  <rect x="128" y="88" width="18" height="26" fill="#c39bd3" opacity="0.7" rx="3"/>

  <!-- Strong eyebrows -->
  <g stroke="#2c3e50" stroke-width="4" stroke-linecap="round">
    <path d="M86 82 Q96 76 104 83"/>
    <path d="M116 83 Q124 76 134 82"/>
  </g>

  <!-- Eyes -->
  <circle cx="94" cy="96" r="6" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
  <circle cx="126" cy="96" r="6" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
  <circle cx="96" cy="95" r="3" fill="#2c3e50"/>
  <circle cx="128" cy="95" r="3" fill="#2c3e50"/>
  <circle cx="97" cy="93" r="1.2" fill="#fff"/>
  <circle cx="129" cy="93" r="1.2" fill="#fff"/>

  <!-- Confident smirk mouth -->
  <path d="M92 120 Q110 128 128 120" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 124 Q110 122 120 124" fill="none" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>

  <!-- Prominent chin (below oval face, width of oval bottom) -->
  <rect x="89" y="132" width="42" height="14" fill="#6c3483" rx="3"/>
  <!-- Chin highlight -->
  <rect x="94" y="133" width="14" height="6" fill="#c39bd3" opacity="0.6" rx="2"/>
</svg>