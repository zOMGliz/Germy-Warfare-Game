<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Glow layers (outer to inner) -->
  <circle cx="20" cy="20" r="16" fill="#ffdd44" opacity="0.2"/>
  <circle cx="20" cy="20" r="13" fill="#ffaa00" opacity="0.35"/>
  <circle cx="20" cy="20" r="10" fill="#ff8800" opacity="0.5"/>

  <!-- Core orb -->
  <circle cx="20" cy="20" r="7" fill="#ffcc22" stroke="#cc8800" stroke-width="2"/>

  <!-- Highlight shine -->
  <circle cx="16" cy="16" r="3" fill="#fff" opacity="0.7"/>

  <!-- Tiny pulse ring (subtle) -->
  <circle cx="20" cy="20" r="8.5" fill="none" stroke="#ffee88" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="8.5;11;8.5" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</svg>