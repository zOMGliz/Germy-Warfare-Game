<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Shadow -->
  <ellipse cx="100" cy="170" rx="45" ry="12" fill="#000000" opacity="0.3"/>

  <!-- Main body (purple capsid, darker/dull) -->
  <circle cx="100" cy="95" r="48" fill="#6b3a7a" stroke="#4a2a58" stroke-width="4"/>

  <!-- Highlight on body (dimmer) -->
  <circle cx="82" cy="72" r="18" fill="#8b5a9d" opacity="0.4"/>

  <!-- Glycoproteins (dull red, cracked) -->
  <g fill="#8b3a3a" stroke="#5c2a2a" stroke-width="2">
    <!-- Top -->
    <g>
      <circle cx="100" cy="36" r="10"/>
      <!-- cracks -->
      <line x1="95" y1="32" x2="105" y2="40" stroke="#5c2a2a" stroke-width="1.5"/>
      <line x1="96" y1="39" x2="104" y2="33" stroke="#5c2a2a" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="80" cy="42" r="9"/>
      <line x1="76" y1="38" x2="84" y2="46" stroke="#5c2a2a" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="120" cy="42" r="9"/>
      <line x1="116" y1="38" x2="124" y2="46" stroke="#5c2a2a" stroke-width="1.5"/>
    </g>
    <!-- Top-left / Top-right -->
    <g>
      <circle cx="60" cy="58" r="9"/>
      <line x1="56" y1="54" x2="64" y2="62" stroke="#5c2a2a" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="140" cy="58" r="9"/>
      <line x1="136" y1="54" x2="144" y2="62" stroke="#5c2a2a" stroke-width="1.5"/>
    </g>
    <!-- Sides -->
    <g>
      <circle cx="48" cy="95" r="10"/>
      <line x1="43" y1="90" x2="53" y2="100" stroke="#5c2a2a" stroke-width="1.5"/>
      <line x1="44" y1="99" x2="52" y2="91" stroke="#5c2a2a" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="152" cy="95" r="10"/>
      <line x1="147" y1="90" x2="157" y2="100" stroke="#5c2a2a" stroke-width="1.5"/>
    </g>
    <!-- Bottom-left / Bottom-right -->
    <g>
      <circle cx="60" cy="132" r="9"/>
      <line x1="56" y1="128" x2="64" y2="136" stroke="#5c2a2a" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="140" cy="132" r="9"/>
      <line x1="136" y1="128" x2="144" y2="136" stroke="#5c2a2a" stroke-width="1.5"/>
    </g>
    <!-- Bottom -->
    <g>
      <circle cx="80" cy="148" r="9"/>
      <line x1="76" y1="144" x2="84" y2="152" stroke="#5c2a2a" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="120" cy="148" r="9"/>
      <line x1="116" y1="144" x2="124" y2="152" stroke="#5c2a2a" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Tiny stems (duller) -->
  <g stroke="#5c2a2a" stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="55" x2="100" y2="48"/>
    <line x1="82" y1="62" x2="77" y2="55"/>
    <line x1="118" y1="62" x2="123" y2="55"/>
    <line x1="67" y1="75" x2="60" y2="67"/>
    <line x1="133" y1="75" x2="140" y2="67"/>
    <line x1="57" y1="95" x2="60" y2="95"/>
    <line x1="143" y1="95" x2="140" y2="95"/>
    <line x1="67" y1="115" x2="60" y2="123"/>
    <line x1="133" y1="115" x2="140" y2="123"/>
    <line x1="82" y1="128" x2="77" y2="135"/>
    <line x1="118" y1="128" x2="123" y2="135"/>
  </g>

  <!-- Face: X eyes + frown -->
  <!-- X eyes (destroyed) -->
  <g stroke="#fff" stroke-width="3" stroke-linecap="round">
    <!-- Left eye X -->
    <line x1="77" y1="83" x2="87" y2="93"/>
    <line x1="77" y1="93" x2="87" y2="83"/>
    <!-- Right eye X -->
    <line x1="113" y1="83" x2="123" y2="93"/>
    <line x1="113" y1="93" x2="123" y2="83"/>
  </g>

  <!-- Frown mouth (sadder) -->
  <path d="M85 118 Q100 105 115 118" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
</svg>
